[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mangobd"
version = "0.1.0"
description = "Evidence-backed AI GTM and BD intelligence pipeline for Mango Labs"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.8.30"]

[project.optional-dependencies]
workbook = ["openpyxl>=3.1.5", "Pillow>=12.1"]

[project.scripts]
mangobd = "mangobd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
